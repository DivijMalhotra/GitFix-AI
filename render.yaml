# Render Blueprint — deploys all 4 services on the free plan.
#
# Free-tier caveats to know before you deploy:
#  - Free web services spin down after 15 min idle (cold start ~30-60s).
#  - Free web services get NO persistent disk — the Chroma vector index
#    is wiped on every redeploy/restart. Re-indexing a repo is cheap and
#    idempotent (the app already deletes+recreates the collection), so
#    this is fine for a demo but not for production use.
#  - Chroma is exposed as a public web service (Render's free plan can't
#    do private-only services), with no auth in front of it. Don't index
#    anything sensitive on the free tier.
#
# Some values below are marked `sync: false`, meaning Render will prompt
# you to fill them in when you deploy this blueprint (via "New +" ->
# "Blueprint" in the Render dashboard). A few — the cross-service URLs —
# can only be known *after* the services first get their onrender.com
# hostnames, so you'll fill those in once, then trigger one redeploy.

services:
  # ── Vector DB ─────────────────────────────────────────────
  - type: web
    name: ai-debugger-chroma
    runtime: image
    image:
      url: docker.io/chromadb/chroma:0.5.5
    plan: free
    envVars:
      - key: IS_PERSISTENT
        value: "TRUE"
      - key: ANONYMIZED_TELEMETRY
        value: "FALSE"
      - key: PORT
        value: "8000"

  # ── AI engine (FastAPI) ───────────────────────────────────
  - type: web
    name: ai-debugger-ai-engine
    runtime: docker
    rootDir: ai-engine
    plan: free
    envVars:
      - key: CHROMA_HOST
        sync: false  # e.g. ai-debugger-chroma-xxxx.onrender.com (no https://)
      - key: CHROMA_PORT
        value: "443"
      - key: CHROMA_SSL
        value: "true"
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_API_KEY
        sync: false

  # ── Backend API (Express + MongoDB) ───────────────────────
  - type: web
    name: ai-debugger-backend
    runtime: docker
    rootDir: backend
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false  # MongoDB Atlas free M0 connection string
      - key: JWT_SECRET
        generateValue: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false  # https://<backend-url>.onrender.com/api/auth/github/callback
      - key: NEXT_PUBLIC_APP_URL
        sync: false  # https://<frontend-url>.onrender.com
      - key: AI_ENGINE_URL
        sync: false  # https://<ai-engine-url>.onrender.com

  # ── Frontend (Next.js) ─────────────────────────────────────
  - type: web
    name: ai-debugger-frontend
    runtime: docker
    rootDir: frontend
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false  # https://<backend-url>.onrender.com — baked in at build time
      - key: NEXT_PUBLIC_APP_URL
        sync: false  # https://<frontend-url>.onrender.com — baked in at build time
